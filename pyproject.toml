[project]
name = "dehaze-lora"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.12.0",
    "torchvision>=0.20.0",
    "diffusers>=0.34.0",
    "transformers>=4.52.0",
    "peft>=0.13.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "scikit-image>=0.24.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.65.0",
    "wandb>=0.18.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
