# ===== Model =====
model_name: "black-forest-labs/FLUX.2-klein-base-9B"
lora_target: "both"           # "qwen" | "transformer" | "both"
lora_rank: 16
lora_alpha: 8

# ===== Training =====
seed: 42
batch_size: 4                 # per-device batch (2x40GB: 4; 1x80GB: 2)
gradient_accumulation_steps: 8  # effective batch = 4 x 8 = 32
max_steps: 1000                # optimizer steps
transformer_lr: 1e-3           # Muon learning rate for transformer LoRA
qwen_lr: 1e-4                  # Muon learning rate for Qwen3 LoRA
weight_decay: 0.01
momentum: 0.95
transformer_grad_clip: 1.0     # max grad norm for transformer LoRA
qwen_grad_clip: 1.0            # max grad norm for Qwen3 LoRA
caption_dropout_rate: 0.1     # 10% empty prompt; target remains GT clear image for CFG
max_sequence_length: 512
transformer_device: "cuda:0"   # GPU for transformer + VAE
qwen_device: "cuda:1"          # GPU for Qwen3 text encoder
gradient_checkpointing: true   # recompute activations to save VRAM

# Single 80GB GPU override:
#   batch_size: 2, gradient_accumulation_steps: 16,
#   transformer_device: "cuda:0", qwen_device: "cuda:0",
#   gradient_checkpointing: false

# ===== Inference =====
guidance_scale: 3.5
num_inference_steps: 28

# ===== Data =====
train_metadata: "data/processed/RESIDE/metadata_train.jsonl"
val_metadata: "data/processed/NH-HAZE/metadata.jsonl"

# ===== Checkpointing =====
output_dir: "outputs/checkpoints"
save_every: 100
log_freq: 5

# ===== wandb =====
wandb_project: "dehaze-flux2-klein"
wandb_entity: null
wandb_mode: "online"          # "online" | "offline" | "disabled"

# ===== Validation =====
val_split: 0.05               # fraction of RESIDE held out for validation
val_subset_size: 4             # images per validation run
val_guidance_scale: 3.5        # CFG scale during validation
val_num_inference_steps: 28    # denoising steps during validation
